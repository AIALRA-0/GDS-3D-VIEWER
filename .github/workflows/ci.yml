name: ci

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install web dependencies
        run: npm install

      - name: Build web
        run: npm run build:web

      - name: Build local legacy entry
        run: npm run build:legacy

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        working-directory: apps/api
        run: pytest -q

      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Verify public preview and untrusted file boundaries
        run: npm run test:public

      - name: Start API
        working-directory: apps/api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 34000 > /tmp/gds-3d-viewer-api.log 2>&1 &
          echo $! > /tmp/gds-3d-viewer-api.pid

      - name: Start web dev server
        working-directory: apps/web
        run: |
          npm run dev -- --mode legacy --host 127.0.0.1 --port 4173 > /tmp/gds-3d-viewer-web.log 2>&1 &
          echo $! > /tmp/gds-3d-viewer-web.pid

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:34000/health && break
            sleep 1
          done
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:4173 && break
            sleep 1
          done

      - name: Run Playwright smoke
        working-directory: apps/web
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4173
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: |
          echo '===== API LOG ====='
          cat /tmp/gds-3d-viewer-api.log || true
          echo '===== WEB LOG ====='
          cat /tmp/gds-3d-viewer-web.log || true
