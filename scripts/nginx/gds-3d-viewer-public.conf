# Static public preview only. The Python API is never proxied from this host.
server {
    listen 80;
    listen [::]:80;
    server_name gds3d.aialra.online;
    return 301 https://gds3d.aialra.online$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gds3d.aialra.online;
    ssl_certificate /etc/letsencrypt/live/gds3d.aialra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gds3d.aialra.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/aialra/www/gds-3d-viewer/current;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1k;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;
    add_header Cache-Control "no-cache" always;
    location ~ (^|/)\. { return 404; }
    location ~ ^/(api|review-assets|reference-viewer|legacy\.html)(/|$) { return 404; }
    location = / { try_files /index.html =404; }
    location / { try_files $uri =404; }
}
