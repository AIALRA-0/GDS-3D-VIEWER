# Compatibility entry for bookmarks using the previous public hostname.
server {
    listen 80;
    listen [::]:80;
    server_name icviewer.aialra.online;
    return 301 https://gds3d.aialra.online$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name icviewer.aialra.online;
    ssl_certificate /etc/letsencrypt/live/icviewer.aialra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icviewer.aialra.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    location ~ (^|/)\. { return 404; }
    location ~ ^/(api|review-assets|reference-viewer|legacy\.html)(/|$) { return 404; }
    location / { return 301 https://gds3d.aialra.online$request_uri; }
}
